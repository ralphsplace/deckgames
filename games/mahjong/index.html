<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahjong Solitaire</title>
<link rel="stylesheet" href="../../shared/cards.css">
<style>
  :root { --ux: min(calc((100vw - 36px) / 31), 26px); --uy: calc(var(--ux) * 1.3); --dz: calc(var(--ux) * .16); --felt: #0b5a45; }
  #app { max-width: 880px; margin: 0 auto; padding: 12px; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  header h1 { font-size: 20px; margin: 0 auto 0 0; }
  #stats { font-size: 14px; opacity: .92; width: 100%; }
  #msg { min-height: 22px; font-size: 14px; margin: 4px 0 8px; }
  #msg b { color: #ffd54a; }
  #board { position: relative; margin: 0 auto; width: calc(var(--ux) * 30 + 14px); height: calc(var(--uy) * 16 + 14px); }
  .tile { position: absolute; width: calc(var(--ux) * 2); height: calc(var(--uy) * 2); border-radius: 5px; cursor: pointer;
          background: linear-gradient(145deg, #fffdf4, #ece4cb); padding: 3px 4px;
          box-shadow: 1px 1px 0 #cdbf92, 2px 2px 0 #b3a477, 3px 4px 5px rgba(0,0,0,.4); transition: transform .12s, opacity .25s, filter .15s; }
  .tile svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .tile.blocked { filter: brightness(.8) saturate(.8); cursor: default; }
  .tile.sel { outline: 3px solid #ffd54a; outline-offset: -1px; transform: translateY(-2px); filter: none; }
  .tile.hint { animation: pulse .7s ease-in-out infinite alternate; }
  .tile.gone { opacity: 0; transform: scale(.6); pointer-events: none; }
  .tile.shake { animation: shake .25s; }
  @keyframes pulse { to { outline: 3px solid #7cf3a8; outline-offset: -1px; filter: brightness(1.1); } }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  #over { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.6); z-index: 9999; }
  #over.show { display: grid; }
  #over div { background: #fff; color: #0a3a20; padding: 26px 36px; border-radius: 12px; text-align: center; font-size: 20px; }
  #over button { margin-top: 14px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../../">&larr; Games</a>
    <h1>Mahjong Solitaire</h1>
    <button id="undo">Undo</button>
    <button id="hint">Hint</button>
    <button id="shuffle">Shuffle</button>
    <button id="restart" title="Replay this same deal">Restart deal</button>
    <button id="new">New game</button>
    <div id="stats"></div>
  </header>
  <div id="msg"></div>
  <div id="board"></div>
</div>
<div id="over"><div><span id="overtext"></span><br><button id="again">Play again</button></div></div>

<script type="module">
import { Game } from './engine/game.js';
import { faceSvg } from './faces.js';
import { rng } from '../../shared/rng.js';

const $ = id => document.getElementById(id);
const board = $('board');
let game, seed, els = new Map(), sel = null, hintTimer = null, start = 0, timer = null, finished = false;
const BEST = 'deckgames.mahjong.best';

const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const elapsed = () => Math.floor((Date.now() - start) / 1000);

function build() {
  board.innerHTML = ''; els.clear();
  for (const t of game.tiles) {
    const d = document.createElement('div');
    d.className = 'tile';
    d.innerHTML = faceSvg(t.face);
    d.style.left = `calc(var(--ux) * ${t.x} - var(--dz) * ${t.z} + 4px)`;
    d.style.top = `calc(var(--uy) * ${t.y} - var(--dz) * ${t.z} + 4px)`;
    d.style.zIndex = t.z * 10 + 1;
    d.onclick = () => onTile(t);
    board.appendChild(d); els.set(t.id, d);
  }
}
function refresh() {
  for (const t of game.tiles) {
    const d = els.get(t.id);
    d.classList.toggle('gone', t.removed);
    d.classList.toggle('blocked', !t.removed && !game.free(t));
    d.classList.toggle('sel', sel === t);
    if (t.removed) d.style.display = 'none'; else d.style.display = '';
  }
  $('stats').textContent = `Tiles left: ${game.left} · Moves: ${game.moves} · Shuffles: ${game.shuffles} · Deal #${seed} · Time ${mmss(finished ? finalTime : elapsed())}` +
    (storeGet(BEST) ? ` · Best ${mmss(+storeGet(BEST))}` : '');
  let m = '';
  if (game.won) m = '<b>Board cleared!</b>';
  else if (game.stuck) m = '<b>No more moves.</b> Press Shuffle (the new arrangement is always solvable).';
  else m = `${game.hint() ? 'Moves available.' : ''} Match two free tiles of the same kind. Flowers match any flower, seasons any season.`;
  $('msg').innerHTML = m;
}
function storeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

let finalTime = 0;
function clearHint() { clearTimeout(hintTimer); els.forEach(e => e.classList.remove('hint')); }
function onTile(t) {
  if (t.removed || finished) return;
  clearHint();
  if (!game.free(t)) { const e = els.get(t.id); e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); return; }
  if (sel === t) sel = null;
  else if (sel && game.canRemove(sel, t)) {
    game.remove(sel, t); sel = null;
    if (game.won) win();
  } else sel = t;
  refresh();
}
function win() {
  finished = true; finalTime = elapsed(); clearInterval(timer);
  const best = +storeGet(BEST) || Infinity;
  const isBest = game.shuffles === 0 && finalTime < best;
  if (isBest) storeSet(BEST, finalTime);
  $('overtext').textContent = `Cleared in ${mmss(finalTime)} with ${game.shuffles} shuffle${game.shuffles === 1 ? '' : 's'}.${isBest ? ' New best time!' : ''}`;
  $('over').classList.add('show');
}
function begin(s) {
  seed = s; game = new Game(rng(seed)); sel = null; finished = false; finalTime = 0;
  clearHint(); $('over').classList.remove('show');
  build(); start = Date.now(); clearInterval(timer);
  timer = setInterval(() => { if (!finished) refresh(); }, 1000);
  refresh();
}
const fresh = () => Math.floor(Math.random() * 1e6) + 1;

$('new').onclick = () => begin(fresh());
$('again').onclick = () => begin(fresh());
$('restart').onclick = () => begin(seed);
$('undo').onclick = () => { if (finished) return; clearHint(); sel = null; game.undo(); refresh(); };
$('shuffle').onclick = () => { if (finished) return; clearHint(); sel = null; game.shuffle(); build(); refresh(); };
$('hint').onclick = () => {
  if (finished) return;
  clearHint(); sel = null;
  const m = game.hint();
  if (!m) { refresh(); return; }
  m.forEach(t => els.get(t.id).classList.add('hint'));
  hintTimer = setTimeout(clearHint, 2500); refresh();
};
begin(fresh());
</script>
</body>
</html>
